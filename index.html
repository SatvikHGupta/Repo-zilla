<!doctype html>
<html lang="en" data-mode="dark" data-accent="amber">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="A free, searchable catalog of every public GitHub repository with 50 or more stars, with READMEs, tags and filters." />
    <meta name="theme-color" content="#0f1012" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>RepoZilla · every public GitHub repo with 50+ stars</title>
    <style>
      /* shown before React mounts; replaced as soon as the app renders */
      #boot { min-height: 100vh; display: grid; place-items: center; background: var(--bg, #0f1012); }
      #boot svg { width: 56px; height: 56px; opacity: 0.9; }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot" aria-hidden="true">
        <svg viewBox="0 0 32 32" fill="none" stroke="var(--accent, #f2a93b)"><rect x="1.5" y="1.5" width="29" height="29" rx="8" stroke-width="2" /><path d="M9.5 10.5h13l-13 11h13" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" /></svg>
      </div>
    </div>
    <noscript>RepoZilla needs JavaScript to search the catalog in your browser.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
